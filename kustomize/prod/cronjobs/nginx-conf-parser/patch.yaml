apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-archiver-cronjob
spec:
  # AWST 08:00 every day
  schedule: '0 16 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: log-archiver-cronjob
              args: ['nginx_config_subdomain_auth.py', '--container', 'analytics']
              envFrom:
                - secretRef:
                    name: log-archiver-env-prod
