apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-archiver-cronjob
spec:
  schedule: '5 8 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: log-archiver-cronjob
              args: ['dns_zones.py']
              envFrom:
                - secretRef:
                    name: log-archiver-env-prod
