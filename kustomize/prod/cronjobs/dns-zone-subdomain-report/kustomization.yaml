apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../templates
nameSuffix: -dns-zone-subdomain-report
patches:
  - path: patch.yaml
  - target:
      kind: CronJob
      name: log-archiver-cronjob
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/name
        value: log-archiver-cronjob-dns-zone-subdomain-report
