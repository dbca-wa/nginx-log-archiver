[project]
name = "nginx-access-log-archiver"
version = "1.1.3"
description = "Utility for archiving the department's preserved Nginx access logs in the Parquet column-oriented data file format"
authors = [{ name = "Ashley Felton", email = "ashley.felton@dbca.wa.gov.au" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<4.0"
dependencies = [
  "python-dotenv==1.2.1",
  "azure-storage-blob==12.28.0",
  "pyarrow==23.0.1",
  "orjson==3.11.7",
  "unicodecsv==0.14.1",
  "requests==2.32.5",
  "crossplane==0.5.8",
  "azure-cli==2.81.0",
  "tldextract==5.3.1",
]

[dependency-groups]
dev = ["ipython>=9.10.0", "ipdb>=0.13.13"]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 140
indent-width = 4

[tool.ruff.lint]
ignore = [
  "E501", # Line too long
  "E722", # Bare except
]
