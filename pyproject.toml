[project]
name = "nginx-access-log-archiver"
version = "1.1.0"
description = "Utility for archiving the department's preserved Nginx access logs in the Parquet column-oriented data file format"
authors = [{ name = "Ashley Felton", email = "ashley.felton@dbca.wa.gov.au" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<4.0"
dependencies = [
  "python-dotenv==1.2.1",
  "azure-storage-blob==12.27.1",
  "pyarrow==22.0.0",
  "orjson==3.11.4",
  "unicodecsv==0.14.1",
  "requests==2.32.5",
  "crossplane==0.5.8",
  "azure-cli==2.78.0",
]

[dependency-groups]
dev = ["ipython>=9.6.0", "ipdb>=0.13.13"]

[tool.ruff]
line-length = 140
indent-width = 4

[tool.ruff.lint]
ignore = [
  "E501", # Line too long
  "E722", # Bare except
]
